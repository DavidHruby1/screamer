name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every application module must byte-compile and import on a non-Windows host.
  compile:
    name: compile (ubuntu / py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m compileall src/ tests/ .github/scripts/
      - run: python -c "import src; print('OK')"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1
      - name: Install import dependencies
        run: python -m pip install -r requirements.txt
      - name: Import application modules
        run: |
          python - <<'PY'
          import importlib
          import pkgutil
          import src

          for module in pkgutil.iter_modules(src.__path__, prefix="src."):
              importlib.import_module(module.name)
          print("All application modules imported")
          PY

  # Full test suite on the target platform.
  test:
    name: test (windows / py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Byte-compile
        run: python -m compileall src/ tests/
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

  build:
    name: build (windows / py3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean screamer.spec
      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path dist\Screamer\Screamer.exe)) {
            throw "PyInstaller did not produce dist\Screamer\Screamer.exe"
          }

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.15
      - run: ruff check src/ tests/ .github/scripts/
      - run: ruff format --check src/ tests/ .github/scripts/

  audit:
    name: pip-audit (CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt -r requirements-build.txt
